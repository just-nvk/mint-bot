[project]
name = "mint-bot"
version = "1.0.0"
description = "Telegram-бот записи в салон «Мята» (демо-проект)"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.31,<4",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
